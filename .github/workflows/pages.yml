name: Deploy academic homepage
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: public/visitor-stats.json
          key: visitor-city-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: visitor-city-snapshot-
      - run: node scripts/update-visitor-stats.mjs
        env:
          VISITOR_API_URL: ${{ vars.VISITOR_API_URL }}
          VISITOR_STATS_TOKEN: ${{ secrets.VISITOR_STATS_TOKEN }}
      - run: npm run build:pages
      - run: touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
